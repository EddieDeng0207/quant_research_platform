[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Point-in-time aware data ingestion foundation for medium/low-frequency quant research."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyarrow>=10",
]

[project.optional-dependencies]
china = [
  "akshare>=1.18.38",
  "tushare>=1.4.24",
  "urllib3<2",
]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]

[project.scripts]
qrp-data = "qrp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
